[package]
name = "nova-desktop"
version = "0.1.0"
description = "NOVA — THE NEW STAR. Native shell of the desktop app."
authors = ["NOVA contributors"]
license = "AGPL-3.0"
edition = "2021"

# The Rust side of a Tauri app is intentionally tiny.
# It only opens a native window hosting the React frontend.
[lib]
name = "nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
