# ============================================================
# docker-compose.yml
# ------------------------------------------------------------
# Development infrastructure for NOVA.
# Only DEVELOPMENT credentials here — never production secrets.
#
# Start everything with:  docker compose up -d
# Stop with:              docker compose down
#
# Non-standard host ports are used on purpose (security best practice):
#   PostgreSQL host port 5442, Redis host port 6389.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: devpass          # DEV ONLY — never reuse in production
      POSTGRES_DB: nova
    ports:
      - '5442:5432'                       # host 5442 -> container 5432 (non-standard host port)
    volumes:
      - nova-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nova -d nova']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: unless-stopped
    ports:
      - '6389:6379'                       # host 6389 -> container 6379 (non-standard host port)
    volumes:
      - nova-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nova-pgdata:
  nova-redisdata:

networks:
  default:
    name: nova-dev
